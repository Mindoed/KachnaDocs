name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runs root `prepare` -> `build:shared`, so @kachnadocs/shared/dist
      # exists before web/api import it.
      - name: Install dependencies
        run: npm ci

      # Root `build` triggers `prebuild` (build:shared) then
      # `npm run build --workspaces --if-present`:
      #   web  -> run-p type-check build-only  (vue-tsc + vite build)
      #   api  -> nest build
      # Type checking happens inside each workspace's build.
      - name: Build all workspaces
        run: npm run build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root `test` = `npm run test --workspaces --if-present`, which picks up
      # api (vitest run) and shared (no-op). web has no `test` script -- only
      # test:unit / test:e2e -- so it needs the explicit step below.
      - name: Unit tests (api, shared)
        run: npm test

      - name: Unit tests (web)
        run: npm run test:unit --workspace=web
