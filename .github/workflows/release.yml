name: Build and Publish Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and push"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase to safely match GHCR naming specifications
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Where the site is mounted, baked into the SPA at build time (see the
          # ARG in the Dockerfile). Comes from an Actions *variable* — Settings ->
          # Secrets and variables -> Actions -> Variables -> VITE_BASE_PATH, e.g.
          # "/kachnadocs" for https://example.com/kachnadocs/. Unset builds for the
          # origin root. The container has to be given the same value at run time as
          # BASE_PATH, and it only takes effect in the repo that publishes the image.
          build-args: |
            VITE_BASE_PATH=${{ vars.VITE_BASE_PATH }}
          # Leverages GitHub Actions cache so subsequent builds are lightning fast
          cache-from: type=gha
          cache-to: type=gha,mode=max
