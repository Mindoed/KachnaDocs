name: CI/CD Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  BuildAndPushContainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to the container registy
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: api
          push: true
          tags: |
            ghcr.io/su-fit-vut/kachnadocs-api:latest
            ghcr.io/su-fit-vut/kachnadocs-api:${{ github.ref_name }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: true
          tags: |
            ghcr.io/su-fit-vut/kachnadocs-web:latest
            ghcr.io/su-fit-vut/kachnadocs-web:${{ github.ref_name }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
