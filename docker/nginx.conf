# nginx config for the `web` target of the root Dockerfile.
# /api is proxied to the api container; docker-compose sets the `api` hostname.
# When deploying without nginx in front (SPA on static hosting, api elsewhere),
# point your own proxy at the api service with the same /api prefix.

upstream kachnadocs_api {
    server api:3000;
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://kachnadocs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames from the Vite build — safe to cache hard.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # History-mode router: unknown paths fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
