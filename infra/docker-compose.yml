# Local development infrastructure. Production deployment is the single GHCR
# image + Caddy described in the root Dockerfile; this compose file only exists
# so `npm run dev:*` has a PostgreSQL to talk to.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Matches DATABASE_URL=postgresql://kachna:kachna@localhost:5432/kachnadocs
# used by apps/api/.env and apps/collab/.env.
name: kachnadocs-infra

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kachna
      POSTGRES_PASSWORD: kachna
      POSTGRES_DB: kachnadocs
    ports:
      - '5432:5432'
    volumes:
      - kachnadocs-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kachna -d kachnadocs']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kachnadocs-pgdata:
